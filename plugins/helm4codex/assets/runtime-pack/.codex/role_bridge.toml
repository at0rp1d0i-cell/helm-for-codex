[bridge]
description = "Canonical mapping from repo role names to the currently available generic agent API types."
tool_api = "spawn_agent"
fallback_note = "Current tool sessions still resolve logical roles to generic agent types such as worker or explorer at the last hop."

[roles.ops-orchestrator]
role_toml = "roles/ops-orchestrator.toml"
agent_type = "worker"
model = "gpt-5.4"
reasoning_effort = "high"

[roles.researcher]
role_toml = "roles/researcher.toml"
agent_type = "explorer"
model = "gpt-5.4"
reasoning_effort = "medium"

