name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run pytest -q
      - run: uv run python scripts/check_repo.py
      - run: uv run python ops/checks/check_docs_freshness.py
      - run: uv run python scripts/export_plugin_runtime.py --check
